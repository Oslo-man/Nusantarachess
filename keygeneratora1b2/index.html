<title>Key Generator - NusantaraChess</title>
<!--
  keygeneratora1b2/index.html  -  BERKAS HASIL BUILD (jangan disunting tangan).
  Sumber: src/key-generator/*.tsx (React/TSX) + keygeneratora1b2/template.html (shell ini,
  CSS-nya sudah di dalam tag <style> di bawah). Bangun ulang: npm run build:key-generator
  (ikut dijalankan oleh `npm run build`). Commit hasilnya sebelum deploy.

  Hasilnya tetap SATU berkas: JS di-inline oleh tools/build-key-generator.mjs, tidak ada
  stylesheet/skrip eksternal, tidak ada permintaan jaringan - bisa dibuka langsung dari file://
  atau di-deploy sebagai project Vercel terpisah (Root Directory = keygeneratora1b2).
  Ada DUA tag script inline: (1) "core" = logika kunci tanpa DOM yang memasang window.__keyGen
  (dipakai server/scripts/check-key-generator), (2) UI React (urutan ini WAJIB: skrip pertama dibaca oleh skrip pemeriksa server).

  KOMPATIBILITAS DENGAN SERVER (server/lib/one-time-keys.ts) - spesifikasi ada di src/key-generator/spec.ts:
    - alfabet 32 karakter tanpa I/O/0/1
    - pola per jenis (prefix + ukuran grup payload + ukuran grup kode cek)
    - kode cek = 8 byte pertama HMAC-SHA256(rahasia, "<jenis>:<payload>"), tiap byte
      dipetakan ke alfabet lewat (byte & 31)
    - rahasia = ONE_TIME_KEY_SECRET (minimal 16 karakter), dipakai sebagai teks UTF-8 apa
      adanya (BUKAN di-decode dari hex). TIDAK ADA rahasia bawaan: bila kosong/terlalu pendek,
      generator menolak membuat kunci dan server menolak semua kunci.
  Status "sudah dipakai" TIDAK ada di sini: disimpan server di tabel one_time_keys saat
  kunci pertama kali berhasil dipakai. Generator hanya membuat kunci.

  Halaman ini TIDAK memuat rahasia apa pun: rahasia diketik di peramban, tidak disimpan dan
  tidak dikirim ke mana pun (CSP di keygeneratora1b2/vercel.json memblokir semua permintaan
  jaringan). Siapa pun yang tahu rahasianya bisa membuat kunci, jadi jaga rahasia itu.
-->

    padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  }
