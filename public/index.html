  <noscript>
    <main>
      <h1>NusantaraChess — Catur Indonesia, dari latihan sampai rating</h1>
      <p>NusantaraChess: bermain online dengan rating Elo, berlatih melawan karakter bot, kerjakan puzzle personal, dan bedah partaimu dengan Game Review bertenaga Stockfish.</p>
      <ul>
        <li>Bermain online dengan sistem rating Elo (Bullet, Blitz, Rapid) dan validasi langkah di server.</li>
        <li>Latihan melawan karakter bot Fahri, Adit, Dimas, dan Udin.</li>
        <li>Puzzle personal dari basis data posisi Lichess.</li>
        <li>Game Review dengan analisis Stockfish: akurasi, klasifikasi langkah, dan estimasi rating performa.</li>
      </ul>
      <p>NusantaraChess membutuhkan JavaScript untuk dimainkan. Aktifkan JavaScript di peramban Anda untuk masuk atau mendaftar.</p>
    </main>
  </noscript>
  <!-- NOSCRIPT:END -->
  <div id="route-outlet"></div>

  <script>
    /* AKAR MASALAH YANG DIPERBAIKI: baris ini sebelumnya berbunyi
       "kalau hostname BUKAN localhost/127.0.0.1, pakai backend produksi
       Vercel" - logika terbalik yang menganggap SEMUA cara akses selain
       localhost pasti "produksi". Itu salah: mengakses situs dev lewat
       IP jaringan lokal (mis. http://192.168.x.x:8080, workflow normal
       Termux saat frontend dibuka dari HP/perangkat lain di LAN yang
       sama) JUGA bukan "localhost", jadi kondisi lama ini ikut memaksa
       window.NUSANTARA_API_BASE ke domain backend PRODUKSI Vercel -
       menimpa server lokal yang baru saja dijalankan lewat
       `cd server && npm start`, walau server itu sendiri sehat dan
       tidak mencatat galat apa pun. Akibatnya SETIAP panggilan API
       (termasuk POST /api/auth/register) dikirim ke server produksi,
       bukan ke server dev lokal, dan gagal sebagai network error murni
       di fetch() - persis pesan "Tidak bisa menghubungi server" dari
       shared/api-client.js, TANPA ada apa pun yang salah pada server
       lokal, database Neon, atau endpoint register itu sendiri.

       PERBAIKAN: cek secara EKSPLISIT apakah halaman ini sedang disajikan
       dari domain frontend produksi Vercel-nya sendiri (bukan "asal
       bukan localhost"). Domain dev (localhost, 127.0.0.1, IP LAN
       seperti 192.168.x.x/10.x.x.x, atau *.trycloudflare.com/*.ngrok-*.
       kalau dipakai untuk tunneling) semuanya jatuh ke fallback
       location.hostname di shared/api-client.js, yang sudah otomatis
       benar untuk dev lokal MAUPUN akses lewat IP jaringan. */
    var PRODUCTION_FRONTEND_HOSTS = ["nusantara-chess.vercel.app"];
    if (PRODUCTION_FRONTEND_HOSTS.indexOf(location.hostname) !== -1) {
      window.NUSANTARA_API_BASE = "https://nusantarachess-api.vercel.app/api";
    }
  </script>
