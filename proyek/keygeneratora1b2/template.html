<title>Key Generator - NusantaraChess</title>
<!--
  keygeneratora1b2/index.html  -  BERKAS HASIL BUILD (jangan disunting tangan).
  Sumber: src/key-generator/*.tsx (React/TSX) + keygeneratora1b2/template.html (shell ini,
  CSS-nya sudah di dalam tag <style> di bawah). Bangun ulang: npm run build:key-generator
  (ikut dijalankan oleh `npm run build`). Commit hasilnya sebelum deploy.

  Hasilnya tetap SATU berkas: JS di-inline oleh tools/build-key-generator.mjs, tidak ada
  stylesheet/skrip eksternal, tidak ada permintaan jaringan - bisa dibuka langsung dari file://
  atau di-deploy sebagai project Vercel terpisah (Root Directory = keygeneratora1b2).
  Ada DUA tag script inline: (1) "core" = logika kunci tanpa DOM yang memasang window.__keyGen
  (dipakai server/scripts/check-key-generator), (2) UI React (urutan ini WAJIB: skrip pertama dibaca oleh skrip pemeriksa server).

  KOMPATIBILITAS DENGAN SERVER (server/lib/one-time-keys.ts) - spesifikasi ada di src/key-generator/spec.ts:
    - alfabet 32 karakter tanpa I/O/0/1
    - pola per jenis (prefix + ukuran grup payload + ukuran grup kode cek)
    - kode cek = 8 byte pertama HMAC-SHA256(rahasia, "<jenis>:<payload>"), tiap byte
      dipetakan ke alfabet lewat (byte & 31)
    - rahasia = ONE_TIME_KEY_SECRET (minimal 16 karakter), dipakai sebagai teks UTF-8 apa
      adanya (BUKAN di-decode dari hex). TIDAK ADA rahasia bawaan: bila kosong/terlalu pendek,
      generator menolak membuat kunci dan server menolak semua kunci.
  Status "sudah dipakai" TIDAK ada di sini: disimpan server di tabel one_time_keys saat
  kunci pertama kali berhasil dipakai. Generator hanya membuat kunci.

  Halaman ini TIDAK memuat rahasia apa pun: rahasia diketik di peramban, tidak disimpan dan
  tidak dikirim ke mana pun (CSP di keygeneratora1b2/vercel.json memblokir semua permintaan
  jaringan). Siapa pun yang tahu rahasianya bisa membuat kunci, jadi jaga rahasia itu.
-->
<style>
  :root {

    --bg-surface: #262522;

    --text-body: #dedede;

    --text-disabled: #706c66;
    --text-on-accent: #1a1a1a;
    --accent: #81B64C;
    --accent-hover: #8BC550;
    --accent-active: #557a38;
    --accent-soft: rgba(129, 182, 76, 0.16);

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.5;
    padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

  h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; color: var(--text-primary); letter-spacing: -0.01em; }
  h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--text-primary); }
  p { margin: 0; }
  .lead { margin-top: 0.5rem; color: var(--text-muted); max-width: 60ch; }

  button, input, summary { font: inherit; }
  button { border: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .type { position: relative; display: block; }
  .type input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .type-face {
    display: flex; flex-direction: column; gap: 0.25rem;
    min-height: 76px; padding: 0.75rem 0.875rem;
    background: var(--bg-surface); border-radius: var(--radius-md);
    transition: background-color 0.12s ease;
  }
  .type:hover .type-face { background: #2e2d2a; }
  .type input:checked + .type-face { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

  .type-note { font-size: 0.8125rem; color: var(--text-muted); }

  .make { display: flex; gap: 0.5rem; align-items: stretch; }
  .qty { display: flex; flex-direction: column; gap: 0.25rem; }
  .qty label { font-size: 0.8125rem; color: var(--text-muted); }
  input[type="number"], input[type="password"], input[type="text"] {

    background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.14) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(255, 255, 255, 0.035) 100%);
    color: #F2F1F0; caret-color: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 0.625rem;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.50), inset 0 1px 2px rgba(0, 0, 0, 0.40), inset 0 -1px 0 rgba(255, 255, 255, 0.06), inset 0 -10px 14px -12px rgba(255, 255, 255, 0.06), 0 1px 0 rgba(255, 255, 255, 0.04);
    min-height: var(--tap); padding: 0 0.75rem; width: 100%;
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="number"]:hover, input[type="password"]:hover, input[type="text"]:hover { background-color: rgba(0, 0, 0, 0.36); border-color: rgba(255, 255, 255, 0.18); }
  input[type="number"]::placeholder, input[type="password"]::placeholder, input[type="text"]::placeholder { color: #9E9D9C; opacity: 1; }
  input[type="number"] { width: 6rem; }
  input[type="number"]:focus, input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--accent); background-color: rgba(0, 0, 0, 0.40);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.50), inset 0 1px 2px rgba(0, 0, 0, 0.40), 0 0 0 3px rgba(129, 182, 76, 0.22);
  }
  .btn {

  }
  .btn:hover:not(:disabled) { background: var(--btn-neutral-hover); }

  .btn:disabled { color: var(--text-disabled); cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--text-on-accent); }

  .btn-primary:disabled { background: var(--bg-surface); }
  .btn-small { min-height: 36px; padding: 0 0.875rem; font-size: 0.875rem; }

  .msg { font-size: 0.875rem; min-height: 1.3em; }

  .msg.ok { color: var(--success); }
  .msg.warn { color: var(--warning); }

  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .results-head h2 { margin: 0; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .empty { padding: 1.25rem; background: var(--bg-surface); border-radius: var(--radius-md); color: var(--text-muted); }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .row { display: flex; flex-direction: column; gap: 0.5rem; background: var(--bg-surface); border-radius: var(--radius-md); padding: 0.75rem 0.875rem; }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .row-meta { font-size: 0.8125rem; color: var(--text-muted); }
  .row-meta b { color: var(--text-body); font-weight: 600; }
  .okmark { color: var(--success); font-weight: 600; }
  .key {
    font-family: var(--font-mono); font-size: 1rem; line-height: 1.6; letter-spacing: 0.02em;

  details { background: var(--bg-surface); border-radius: var(--radius-md); }
  summary { list-style: none; cursor: pointer; padding: 0.875rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: var(--tap); border-radius: var(--radius-md); color: var(--text-primary); font-weight: 600; }
  summary::-webkit-details-marker { display: none; }

  .details-body { padding: 0 0.875rem 0.875rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
